<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creation Living World · Blender review</title><style>
*{box-sizing:border-box}body{margin:0;background:#173b39;font-family:system-ui;color:#153c38;display:grid;place-items:center;min-height:100vh}main{position:relative;width:min(100vw,480px);height:min(100vh,900px);overflow:hidden;border-radius:24px;background:#dcebd1}canvas{width:100%;height:100%;display:block}header{position:absolute;top:22px;left:20px;right:20px;text-align:center}h1{margin:0;font-size:24px}p{font-size:13px;margin:6px 0}.controls{position:absolute;bottom:18px;left:14px;right:14px;text-align:center}.tray{display:flex;overflow:auto;gap:5px;background:#ffffffdd;border-radius:21px;padding:8px;margin:10px 0}button{border:0;border-radius:18px;background:#fff5da;padding:10px;font-weight:750;color:#214b42;cursor:pointer}button.selected{background:#c6f09f}button:disabled{opacity:.45;cursor:default}.piece{min-width:62px;padding:4px}.piece canvas{width:55px;height:48px}.primary{background:#3b8068;color:white;padding:13px 24px}.facts{font-size:11px;font-weight:700}.toolbar{margin-top:8px;display:flex;justify-content:center;gap:7px}select{border:0;border-radius:12px;padding:7px;background:#fff}#message{min-height:32px}
</style><main><canvas id="world" width="480" height="900"></canvas><header><h1 id="title"></h1><p>Choose a piece, then tap a space. Rearrange your landscape.</p><div class="toolbar"><select id="round"><option value="1">First three days</option><option value="2">Sky and sea creatures</option><option value="3" selected>A wonderful week</option></select><button id="night">Day / night</button><button id="example">Explore a finished world</button></div></header><div class="controls"><div class="facts" id="facts"></div><p id="message">Give each Creation day its pieces.</p><div class="tray" id="tray"></div><button id="remove">Return selected piece</button> <button class="primary" id="advance">Finish this day</button></div></main><script>
const LEVELS=__LEVELS__,ROOT='../../Frontend/mobile/assets/images/games/creation_world/',ARK='../../Frontend/mobile/assets/images/games/ark_traffic/';
const cv=document.querySelector('#world'),ctx=cv.getContext('2d'),img={},placements={},commands=[];
const FLOORS=new Set(['water','land','forest']),SKY=new Set(['light','cloud','sun','moon']),NAMES=['Light','Sky','Land, seas and plants','Sun, moon and stars','Fish and birds','Animals and people','A day of rest'];
let world=LEVELS['3'].world,done=0,selected=null,night=false,loaded=false;const board={x:29,y:252,w:422,h:380};
const kind=id=>world.pieces.find(p=>p.id===id).kind,layer=k=>FLOORS.has(k)?'ground':SKY.has(k)?'sky':'life';
function neighbors(c){let r=Math.floor(c/5),x=c%5;return[r>0?c-5:null,r<3?c+5:null,x>0?c-1:null,x<4?c+1:null].filter(x=>x!==null)}
function connected(start,allowed){if(!allowed.has(start))return new Set();let found=new Set([start]),q=[start];for(let i=0;i<q.length;i++)for(let n of neighbors(q[i]))if(allowed.has(n)&&!found.has(n)){found.add(n);q.push(n)}return found}
function facts(){let floor=new Map(Object.entries(placements).filter(([id])=>FLOORS.has(kind(id))).map(([id,c])=>[c,kind(id)])),water=new Set([...floor].filter(([,k])=>k==='water').map(([c])=>c)),land=new Set([...floor].filter(([,k])=>k==='land').map(([c])=>c));let river=connected(0,water),meadow=land.size?connected(Math.min(...land),land):new Set();let phase=Math.min(done+1,world.days.length),all=world.pieces.filter(p=>p.day<=phase).every(p=>p.id in placements),safe=true;for(let[id,c]of Object.entries(placements)){let k=kind(id);if(k==='fish'&&!river.has(c)||k==='bird'&&floor.get(c)!=='forest'||['goat','rabbit'].includes(k)&&!meadow.has(c))safe=false}return{floor,river,meadow,riverOK:river.has(15),landOK:land.size>=4&&meadow.size===land.size,safe,ready:all&&(phase<3||river.has(15)&&land.size>=4&&meadow.size===land.size)&&(phase<5||safe)}}
function refresh(){let phase=Math.min(done+1,world.days.length),f=facts();document.querySelector('#title').textContent=done===world.days.length?'Your living world':`Day ${phase} · ${NAMES[phase-1]}`;document.querySelector('#advance').disabled=done===world.days.length||!f.ready;document.querySelector('#advance').textContent=phase===7?'Rest and enjoy your world':`Finish day ${phase}`;document.querySelector('#facts').textContent=phase<3?'':`${f.riverOK?'✓':'○'} Flowing river   ${f.landOK?'✓':'○'} Open meadow   ${f.safe?'✓':'○'} Safe homes`;let tray=document.querySelector('#tray');tray.replaceChildren();for(let p of world.pieces.filter(p=>p.day<=phase&&!(p.id in placements))){let b=document.createElement('button');b.className='piece'+(selected===p.id?' selected':'');let c=document.createElement('canvas');c.width=112;c.height=100;let g=c.getContext('2d');if(img[p.kind])g.drawImage(img[p.kind],0,0,p.kind==='fish'||p.kind==='bird'?224:img[p.kind].naturalHeight,p.kind==='fish'||p.kind==='bird'?224:img[p.kind].naturalHeight,0,0,112,100);b.append(c,document.createTextNode(p.kind));b.onclick=()=>{selected=p.id;refresh()};tray.append(b)}}
function center(c){return{x:board.x+(c%5+.5)*board.w/5,y:board.y+(Math.floor(c/5)+.5)*board.h/4}}
function draw(k,x,y,w,h,frame=0){let a=img[k];if(!a)return;if(k==='fish'||k==='bird')ctx.drawImage(a,(frame%8)*224,0,224,224,x-w/2,y-h/2,w,h);else if(k==='goat'||k==='rabbit')ctx.drawImage(a,(frame%9)*160,0,160,160,x-w/2,y-h/2,w,h);else if(FLOORS.has(k)||k==='empty')ctx.drawImage(a,40,49,144,138,x-w/2,y-h/2,w,h);else ctx.drawImage(a,x-w/2,y-h/2,w,h)}
function path(start,allowed){if(!allowed.has(start))return[start];let q=[start],previous=new Map([[start,null]]),end=start;for(let i=0;i<q.length;i++){end=q[i];for(let n of neighbors(end))if(allowed.has(n)&&!previous.has(n)){previous.set(n,end);q.push(n)}}let p=[];for(let c=end;c!==null;c=previous.get(c))p.unshift(c);return [...p,...p.slice(0,-1).reverse()]}
function paint(t){ctx.clearRect(0,0,480,900);if(img.background)ctx.drawImage(img.background,0,0,480,900);if(night){ctx.fillStyle='#172e6155';ctx.fillRect(0,0,480,900)}let f=facts();for(let c=0;c<20;c++){let p=center(c);draw(f.floor.get(c)||'empty',p.x,p.y,95,119);if(c===0||c===15){ctx.fillStyle='#15475a';ctx.font='bold 10px system-ui';ctx.fillText(c===0?'SOURCE':'SEA',p.x-20,p.y+20)}}for(let[id,c]of Object.entries(placements)){let k=kind(id);if(FLOORS.has(k))continue;let p=center(c),frame=0;if(SKY.has(k))p.y=board.y-50+Math.sin(t/600)*3;else{let route=k==='fish'&&f.riverOK?path(c,f.river):['goat','rabbit'].includes(k)&&f.landOK?path(c,f.meadow):k==='bird'&&f.floor.get(c)==='forest'?[c,...[...f.floor].filter(([,k])=>k==='forest').map(([c])=>c).filter(n=>n!==c),c]:[c];if(route.length>1){let q=(t/1700)%(route.length-1),i=Math.floor(q),a=center(route[i]),b=center(route[i+1]);p={x:a.x+(b.x-a.x)*(q-i),y:a.y+(b.y-a.y)*(q-i)};if(k==='bird')p.y-=Math.sin((q-i)*Math.PI)*65;frame=1+Math.floor(t/125)%8}}draw(k,p.x,p.y-10,78,78,frame);if(selected===id){ctx.strokeStyle='#eeb94b';ctx.lineWidth=3;ctx.strokeRect(p.x-35,p.y-35,70,70)}}requestAnimationFrame(paint)}
cv.onclick=e=>{let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*480/r.width,y=(e.clientY-r.top)*900/r.height;if(x<board.x||x>=board.x+board.w||y<board.y||y>=board.y+board.h)return;let c=Math.floor((y-board.y)/(board.h/4))*5+Math.floor((x-board.x)/(board.w/5));if(selected){let k=kind(selected);if(SKY.has(k)&&c>=5){document.querySelector('#message').textContent='Sky pieces belong in the top row.';return}if(Object.entries(placements).some(([id,n])=>id!==selected&&n===c&&layer(kind(id))===layer(k))){document.querySelector('#message').textContent='Move the piece already in this space first.';return}placements[selected]=c;commands.push({op:'place',piece_id:selected,cell:c});selected=null}else{let id=Object.entries(placements).find(([id,n])=>n===c&&layer(kind(id))==='life')?.[0]||Object.entries(placements).find(([,n])=>n===c)?.[0];selected=id||null;if(id)document.querySelector('#message').textContent=`${kind(id)}: choose a different space or return it to the tray.`}refresh()};
document.querySelector('#advance').onclick=()=>{if(!facts().ready)return;commands.push({op:'advance',day:done+1});done++;refresh()};document.querySelector('#remove').onclick=()=>{if(selected&&selected in placements){delete placements[selected];commands.push({op:'remove',piece_id:selected});selected=null;refresh()}};document.querySelector('#night').onclick=()=>night=!night;document.querySelector('#round').onchange=e=>{world=LEVELS[e.target.value].world;for(let id in placements)delete placements[id];commands.length=0;done=0;selected=null;refresh()};
document.querySelector('#example').onclick=()=>{let cells={light:[0],cloud:[1],water:[0,5,10,15,1,2],land:[3,4,8,9,13,14,18,19],forest:[6,11],sun:[2],moon:[3],fish:[5],bird:[6],goat:[3],rabbit:[19]};for(let p of world.pieces)placements[p.id]=cells[p.kind][Number(p.id.split('-').at(-1))-1];done=world.days.length;refresh()};
Promise.all(['background','empty','light','cloud','water','land','forest','sun','moon','fish','bird','goat','rabbit'].map(k=>new Promise(resolve=>{let a=new Image();a.onload=()=>{img[k]=a;resolve()};a.onerror=resolve;a.src=['goat','rabbit'].includes(k)?ARK+k+'-walk.webp':ROOT+k+'.png'}))).then(()=>{loaded=true;refresh();requestAnimationFrame(paint)});
</script></html>
