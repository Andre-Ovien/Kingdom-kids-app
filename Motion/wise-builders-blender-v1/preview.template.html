<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wise Builders · Blender review</title><style>
*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100vh;background:#403c2b;font-family:system-ui;color:#40331f}main{position:relative;width:min(100vw,500px);height:min(100vh,900px);overflow:hidden;border-radius:24px;background:#dce5bd}canvas{width:100%;height:100%}header{position:absolute;top:28px;left:20px;right:20px;text-align:center}h1{font-size:25px;margin:0}p{font-size:13px}button{border:0;border-radius:16px;background:#fff7df;padding:11px;font-weight:750;color:#4b3a20;cursor:pointer}button.selected{background:#f6ce74}button:disabled{opacity:.4}.row{display:flex;justify-content:center;gap:7px;margin-top:10px}.bottom{position:absolute;bottom:20px;left:15px;right:15px;text-align:center}.tray{display:flex;gap:6px;overflow:auto;background:#ffffffdd;border-radius:24px;padding:7px;margin:10px 0}.part{min-width:77px;padding:4px}.part img{width:66px;height:59px;object-fit:contain}.primary{background:#82723b;color:white;padding:14px 24px}select{border:0;border-radius:14px;padding:8px}
</style><main><canvas id="view" width="500" height="900"></canvas><header><h1>The Wise and Foolish Builders</h1><p>Choose foundations, add walls and a roof, then test the storm.</p><div class="row"><button id="a">Little house</button><button id="b">Garden house</button></div><div class="row"><button id="rock">Rock foundation</button><button id="sand">Sand foundation</button><select id="storm"><option value="rain">Rain</option><option value="wind">Wind</option><option value="rain_and_wind" selected>Rain and wind</option></select></div></header><div class="bottom"><p id="message">Choose a house, then its foundation.</p><div class="tray" id="tray"></div><button class="primary" id="test">Test the storm</button> <button id="reset">Build again</button></div></main><script>
const ROOT='../../Frontend/mobile/assets/images/games/wise_builders/',canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),images={},PARTS=['back-wall','left-wall','right-wall','front-wall','roof','brace'];
const houses=[{foundation:null,parts:[]},{foundation:null,parts:[]}],commands=[];let active=0,selected=null,start=null,storm='rain_and_wind';
const targets=[{x:10,y:325,w:235,h:270},{x:255,y:325,w:235,h:270}];
function refresh(){document.querySelector('#a').className=active===0?'selected':'';document.querySelector('#b').className=active===1?'selected':'';document.querySelector('#test').disabled=start!==null||houses.some(h=>!h.foundation||h.parts.length!==6);let tray=document.querySelector('#tray');tray.replaceChildren();if(start!==null)return;for(let p of PARTS.filter(p=>!houses[active].parts.includes(p))){let b=document.createElement('button');b.className='part'+(selected===p?' selected':'');let i=new Image();i.src=ROOT+p+'.png';b.append(i,document.createTextNode(p.replaceAll('-',' ')));b.onclick=()=>{selected=p;refresh()};tray.append(b)}}
function draw(kind,r,frame=0,count=1,opacity=1){let i=images[kind];if(!i)return;ctx.globalAlpha=opacity;let width=i.naturalWidth/count;ctx.drawImage(i,frame*width,0,width,i.naturalHeight,r.x,r.y,r.w,r.h);ctx.globalAlpha=1}
function paint(t){draw('background',{x:0,y:0,w:500,h:900});let phase=start===null?null:Math.min(1,(t-start)/6000);if(phase!==null){ctx.fillStyle='#24385844';ctx.fillRect(0,0,500,900)}houses.forEach((h,index)=>{let r=targets[index];if(phase===null){if(h.foundation)draw(h.foundation,r);draw('standing',r,0,1,.13);for(let p of PARTS)if(h.parts.includes(p))draw(p,r)}else{if(h.foundation==='rock'){draw('rock',r);draw('standing',r)}else draw('collapse',r,Math.min(11,Math.floor(phase*11)),12);if(phase<1)draw('storm-'+storm,r,Math.floor(phase*48)%8,8)}if(index===active&&phase===null){ctx.strokeStyle='#efbe51';ctx.lineWidth=2;ctx.strokeRect(r.x+8,r.y+8,r.w-16,r.h-16)}ctx.fillStyle='#453d25';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(h.foundation||'Choose a foundation',r.x+r.w/2,r.y+r.h+18)});if(phase===1)document.querySelector('#message').textContent=houses[0].foundation!==houses[1].foundation?'The rock foundation stood strong. The sand washed away.':'Try rock and sand to compare the foundations.';requestAnimationFrame(paint)}
document.querySelector('#a').onclick=()=>{if(start===null){active=0;refresh()}};document.querySelector('#b').onclick=()=>{if(start===null){active=1;refresh()}};for(let material of ['rock','sand'])document.querySelector('#'+material).onclick=()=>{let h=houses[active];if(start!==null||h.parts.length)return;h.foundation=material;commands.push({op:'foundation',house_id:'house-'+(active?'b':'a'),material});refresh()};
canvas.onclick=e=>{if(start!==null)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*500/r.width,y=(e.clientY-r.top)*900/r.height,index=targets.findIndex(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);if(index<0)return;active=index;if(selected){let h=houses[index];if(!h.foundation){document.querySelector('#message').textContent='Choose a foundation before adding walls.';return}if(['roof','brace'].includes(selected)&&!PARTS.slice(0,4).every(p=>h.parts.includes(p))){document.querySelector('#message').textContent='All four walls support the roof and brace.';return}h.parts.push(selected);commands.push({op:'place',house_id:'house-'+(index?'b':'a'),part:selected});selected=null}refresh()};
document.querySelector('#test').onclick=()=>{if(houses.some(h=>!h.foundation||h.parts.length!==6))return;storm=document.querySelector('#storm').value;commands.push({op:'storm'});start=performance.now();refresh()};document.querySelector('#reset').onclick=()=>{start=null;selected=null;houses.forEach((h,i)=>{h.foundation=null;h.parts=[];commands.push({op:'reset',house_id:'house-'+(i?'b':'a')})});document.querySelector('#message').textContent='Build again and try different foundations.';refresh()};
Promise.all(['background','rock','sand',...PARTS,'standing','collapse','storm-rain','storm-wind','storm-rain_and_wind'].map(k=>new Promise(resolve=>{let i=new Image();i.onload=()=>{images[k]=i;resolve()};i.onerror=resolve;i.src=ROOT+k+'.png'}))).then(()=>{refresh();requestAnimationFrame(paint)});
</script></html>
